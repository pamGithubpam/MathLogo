<div class="end-container">
  @if (isSprintMode) {
    <h1>Sprint terminé !</h1>
    <p>Tu as réalisé <strong>{{ sprintCount }}</strong> calcul(s) en {{ sprintDuration }} secondes !</p>
    <p class="encouragement">{{ encouragementMessage }}</p>
  } @else {
    <h1>Félicitations !</h1>
    <p>Vous avez terminé le jeu.<span *ngIf="showScore" class="inline-score"> Score final: {{ score }} / {{ total }}</span></p>
  }
  <div class="buttons-container">
    <button class="btn-primary" (click)="restartSameConfig()">Retour configuration</button>
    <button class="btn-secondary" (click)="newGame()">Nouveau jeu</button>
  </div>
</div>
